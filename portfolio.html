<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfólio</title><style>
:root{--bg:#eceff1;--c:#fff;--t:#102027;--m:#5b6b73;--b:#d5dde1;--a:#3949ab}@media(prefers-color-scheme:dark){:root{--bg:#12151c;--c:#1b2029;--t:#e8ecf1;--m:#94a0ad;--b:#2c3440;--a:#8c9eff}}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:720px;margin:0 auto;padding:24px 16px}a{color:var(--a)}h2{font-size:1rem;margin:22px 0 4px}
.c{display:block;background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px 14px;margin:10px 0;color:inherit;text-decoration:none}.c small,.m{color:var(--m)}.c p{margin:4px 0 0}
.t{display:inline-block;background:var(--b);border-radius:99px;padding:2px 10px;margin:2px 4px 2px 0;font-size:.8rem}
</style></head><body><main id="m">Carregando…</main><script>
// Edite estas duas linhas e coloque o projetos.json exportado do app ao lado deste arquivo.
const NOME='Seu nome',BIO='Desenvolvedor full-stack em formação.',m=document.getElementById('m'),e=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('projetos.json').then(r=>r.json()).then(P=>{const draw=()=>{const p=P.find(x=>x.id==location.hash.slice(1));m.innerHTML=p?`<a href="#">Voltar aos projetos</a><h1>${e(p.titulo)}</h1><p class="m">${e(p.status)}</p><p>${e(p.resumo)}</p><p>${p.stack.map(s=>`<span class="t">${e(s)}</span>`).join('')}</p><p>${p.repo?`<a href="${e(p.repo)}">Código</a> `:''}${p.demo?`<a href="${e(p.demo)}">Demonstração</a>`:''}</p><h2>O que aprendi</h2><p>${e(p.aprendizados)}</p><h2>Critérios de entrega atendidos</h2><ul>${p.entrega.map(s=>`<li>${e(s)}</li>`).join('')}</ul>`:`<h1>${e(NOME)}</h1><p>${e(BIO)}</p><h2>Projetos</h2>${P.map(x=>`<a class="c" href="#${e(x.id)}"><b>${e(x.titulo)}</b><br><small>${e(x.status)}: ${e(x.stack.join(', '))}</small><p>${e(x.resumo)}</p></a>`).join('')||'<p>Nenhum projeto ainda.</p>'}`};addEventListener('hashchange',draw);draw()}).catch(()=>m.textContent='Coloque o projetos.json exportado do app ao lado deste arquivo.');
</script></body></html>
